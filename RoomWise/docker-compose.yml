version: '3.9'

# RoomWise — Docker Compose
# Starts the MySQL database container.
# The Java application runs locally in your IDE; it connects to this container on localhost:3306.
#
# USAGE:
#   1. Copy .env.example to .env and fill in your passwords
#   2. docker-compose up -d          <- start database
#   3. docker-compose down           <- stop (data is preserved in the volume)
#   4. docker-compose down -v        <- stop AND wipe all data (fresh start)

services:
  db:
    image: mysql:8.0
    container_name: roomwise_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Persistent data survives container restarts
      - roomwise_data:/var/lib/mysql
      # Init scripts run once on the very first container start (when the volume is empty)
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/main/resources/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  roomwise_data:
    driver: local
